
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StreetWear - La mode urbaine</title>

    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>

    <header class="header">
        <h1>StreetWear</h1>
        <p>La mode urbaine</p>
    </header>

    <main class="container">

        <section class="catalogue">

            <h2>Nos produits</h2>
            <p>Découvrez notre collection StreetWear.</p>

            <div class="filtres">

                <input
                    type="text"
                    id="recherche"
                    placeholder="Rechercher un produit..."
                >

                <select id="filtre">
                    <option value="tous">Toutes les catégories</option>
                    <option value="classic">Classic</option>
                    <option value="graphic">Graphic</option>
                </select>

            </div>

            <div id="produits" class="produits">

                <article class="produit" data-categorie="classic">
                    <h3>T-shirt Classic</h3>
                    <p>Prix : 120 DH</p>
                </article>

                <article class="produit" data-categorie="graphic">
                    <h3>T-shirt Graphic</h3>
                    <p>Prix : 150 DH</p>
                </article>

                <article class="produit" data-categorie="classic">
                    <h3>Sweat Classic</h3>
                    <p>Prix : 250 DH</p>
                </article>

            </div>

        </section>

    </main>
    <footer class="footer">
        <p>&copy; 2026 StreetWear - Tous droits réservés.</p>
    </footer>

</body>
</html>
