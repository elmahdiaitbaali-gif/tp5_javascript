
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreetWear</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>

    <header>
        <h1>StreetWear</h1>
        <p>La mode urbaine</p>
    </header>

    <main>
        <h2>Nos produits</h2>

        <input
            type="text"
            id="recherche"
            placeholder="Rechercher un produit..."
        >

        <select id="filtre">
            <option value="tous">Toutes les catégories</option>
            <option value="classic">Classic</option>
            <option value="graphic">Graphic</option>
        </select>

        <p id="compteur">3 produits</p>

        <section id="produits">
            <div class="produit" data-categorie="classic">
                <h3>T-shirt Classic</h3>
                <p>Prix : 120 DH</p>
            </div>

            <div class="produit" data-categorie="graphic">
                <h3>T-shirt Graphic</h3>
                <p>Prix : 150 DH</p>
            </div>

            <div class="produit" data-categorie="classic">
                <h3>Sweat Classic</h3>
                <p>Prix : 250 DH</p>
            </div>
        </section>

        <p id="message"></p>
    </main>

    <footer>
        <p>StreetWear - 2026</p>
    </footer>

</body>
</html>
